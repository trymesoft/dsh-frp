<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-label="A server connects through an frp tunnel and an authenticated gateway to a laptop showing the DSH Web GUI">
  <defs>
    <linearGradient id="tunnel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4c8dff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft focal halo behind the gateway -->
  <circle cx="320" cy="150" r="112" fill="url(#halo)"/>

  <!-- frp server: a stack of three rack units -->
  <g stroke="#64748b" stroke-width="2.4" fill="none" stroke-linecap="round">
    <rect x="56" y="94" width="72" height="30" rx="7"/>
    <rect x="56" y="135" width="72" height="30" rx="7"/>
    <rect x="56" y="176" width="72" height="30" rx="7"/>
    <path d="M68 109h10M68 150h10M68 191h10" stroke-opacity="0.55"/>
    <circle cx="112" cy="109" r="2.6" fill="#64748b" stroke="none" fill-opacity="0.75"/>
    <circle cx="112" cy="150" r="2.6" fill="#64748b" stroke="none" fill-opacity="0.75"/>
    <circle cx="112" cy="191" r="2.6" fill="#4c8dff" stroke="none"/>
  </g>

  <!-- the tunnel: two dashed strands with packets travelling along them -->
  <g fill="none" stroke="url(#tunnel)" stroke-width="2.6" stroke-linecap="round">
    <path d="M134 143c64-26 84-26 148 0" stroke-dasharray="7 9" stroke-opacity="0.55"/>
    <path d="M506 157c-64 26-84 26-148 0" stroke-dasharray="7 9" stroke-opacity="0.55"/>
  </g>
  <g fill="url(#tunnel)">
    <circle cx="172" cy="137" r="3.2" fill-opacity="0.85"/>
    <circle cx="233" cy="128" r="2.4" fill-opacity="0.55"/>
    <circle cx="407" cy="172" r="3.2" fill-opacity="0.85"/>
    <circle cx="468" cy="163" r="2.4" fill-opacity="0.55"/>
  </g>

  <!-- gateway: a shield on a rounded pedestal -->
  <g>
    <circle cx="320" cy="150" r="42" fill="#4c8dff" fill-opacity="0.10"/>
    <circle cx="320" cy="150" r="42" fill="none" stroke="#4c8dff" stroke-width="2" stroke-opacity="0.55"/>
    <path d="M320 118l24 9v20c0 17-10 30-24 37-14-7-24-20-24-37v-20z"
          fill="url(#screen)" stroke="url(#tunnel)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M310 150l7 7 14-14" fill="none" stroke="#3ee0c0" stroke-width="4.2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- the GUI: a monitor with a window inside -->
  <g>
    <rect x="498" y="104" width="94" height="62" rx="9" fill="url(#screen)" stroke="#4c8dff" stroke-width="2.6"/>
    <path d="M520 166l-5 16h50l-5-16" fill="none" stroke="#4c8dff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M541 182v0" stroke="#4c8dff" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M510 118h30M510 128h44M510 138h22" stroke="#4c8dff" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.6"/>
    <rect x="554" y="116" width="26" height="18" rx="4" fill="none" stroke="#4c8dff" stroke-width="2" stroke-opacity="0.55"/>
  </g>

  <!-- small authenticated-visitor mark, above the shield -->
  <g fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.8">
    <circle cx="320" cy="66" r="7"/>
    <path d="M306 92c2-8 7-12 14-12s12 4 14 12"/>
  </g>
</svg>
