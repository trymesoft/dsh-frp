<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; width:1280px; height:640px; overflow:hidden; }
  body {
    background:#070b14; color:#f3f7ff; position:relative;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "PingFang SC", sans-serif;
    display:flex; flex-direction:column; align-items:center;
  }
  .glow { position:absolute; inset:0;
    background:
      radial-gradient(960px 520px at 50% 108%, rgba(76,141,255,.20), rgba(76,141,255,0) 70%),
      radial-gradient(760px 420px at 50% -8%, rgba(139,92,246,.15), rgba(139,92,246,0) 72%);
  }
  .lockup { display:flex; align-items:center; gap:22px; margin-top:94px; position:relative; }
  .lockup svg { width:68px; height:68px; }
  .word { font-size:78px; font-weight:700; letter-spacing:-2.8px; line-height:1; }
  .tag { margin-top:24px; font-size:27px; color:#93a7c4; position:relative; }
  .tag b { color:#d3e0f2; font-weight:600; }
  .art { margin-top:24px; width:1122px; position:relative; }
  .art svg { display:block; width:1122px; height:auto; }
</style></head>
<body>
  <div class="glow"></div>
  <div class="lockup"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"  role="img" aria-label="dsh-frp tunnel">
  <defs>
    <linearGradient id="tunnel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#tunnel)" opacity="0.14"/>
  <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="13.25" fill="none" stroke="url(#tunnel)" stroke-width="1.5"/>
  <path d="M14 32h10M40 32h10" stroke="url(#tunnel)" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M30 22c6 0 6 20 12 20M34 22c6 0 6 20 12 20" fill="none" stroke="url(#tunnel)" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
  <circle cx="20" cy="32" r="3" fill="url(#tunnel)"/>
  <circle cx="44" cy="32" r="3" fill="url(#tunnel)"/>
  <path d="M25 27l3 5-3 5" fill="none" stroke="url(#tunnel)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M39 27l-3 5 3 5" fill="none" stroke="url(#tunnel)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<span class="word">dsh-frp</span></div>
  <div class="tag">Your DSH Web GUI, over your own <b>frps</b> &mdash; behind an <b>authenticated gateway</b>.</div>
  <div class="art"><svg xmlns="http://www.w3.org/2000/svg" viewBox="44 48 560 169" role="img" aria-label="A server connects through an frp tunnel and an authenticated gateway to a laptop showing the DSH Web GUI">
  <defs>
    <linearGradient id="tunnel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4c8dff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft focal halo behind the gateway -->
  <circle cx="320" cy="150" r="112" fill="url(#halo)"/>

  <!-- frp server: a stack of three rack units -->
  <g stroke="#8b9ab3" stroke-width="2.4" fill="none" stroke-linecap="round">
    <rect x="56" y="94" width="72" height="30" rx="7"/>
    <rect x="56" y="135" width="72" height="30" rx="7"/>
    <rect x="56" y="176" width="72" height="30" rx="7"/>
    <path d="M68 109h10M68 150h10M68 191h10" stroke-opacity="0.55"/>
    <circle cx="112" cy="109" r="2.6" fill="#8b9ab3" stroke="none" fill-opacity="0.75"/>
    <circle cx="112" cy="150" r="2.6" fill="#8b9ab3" stroke="none" fill-opacity="0.75"/>
    <circle cx="112" cy="191" r="2.6" fill="#4c8dff" stroke="none"/>
  </g>

  <!-- the tunnel: two dashed strands with packets travelling along them -->
  <g fill="none" stroke="url(#tunnel)" stroke-width="2.6" stroke-linecap="round">
    <path d="M134 143c64-26 84-26 148 0" stroke-dasharray="7 9" stroke-opacity="0.55"/>
    <path d="M506 157c-64 26-84 26-148 0" stroke-dasharray="7 9" stroke-opacity="0.55"/>
  </g>
  <g fill="url(#tunnel)">
    <circle cx="172" cy="137" r="3.2" fill-opacity="0.85"/>
    <circle cx="233" cy="128" r="2.4" fill-opacity="0.55"/>
    <circle cx="407" cy="172" r="3.2" fill-opacity="0.85"/>
    <circle cx="468" cy="163" r="2.4" fill-opacity="0.55"/>
  </g>

  <!-- gateway: a shield on a rounded pedestal -->
  <g>
    <circle cx="320" cy="150" r="42" fill="#4c8dff" fill-opacity="0.10"/>
    <circle cx="320" cy="150" r="42" fill="none" stroke="#4c8dff" stroke-width="2" stroke-opacity="0.55"/>
    <path d="M320 118l24 9v20c0 17-10 30-24 37-14-7-24-20-24-37v-20z"
          fill="url(#screen)" stroke="url(#tunnel)" stroke-width="3" stroke-linejoin="round"/>
    <path d="M310 150l7 7 14-14" fill="none" stroke="#3ee0c0" stroke-width="4.2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- the GUI: a monitor with a window inside -->
  <g>
    <rect x="498" y="104" width="94" height="62" rx="9" fill="url(#screen)" stroke="#4c8dff" stroke-width="2.6"/>
    <path d="M520 166l-5 16h50l-5-16" fill="none" stroke="#4c8dff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M541 182v0" stroke="#4c8dff" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M510 118h30M510 128h44M510 138h22" stroke="#4c8dff" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.6"/>
    <rect x="554" y="116" width="26" height="18" rx="4" fill="none" stroke="#4c8dff" stroke-width="2" stroke-opacity="0.55"/>
  </g>

  <!-- small authenticated-visitor mark, above the shield -->
  <g fill="none" stroke="#8b9ab3" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.8">
    <circle cx="320" cy="66" r="7"/>
    <path d="M306 92c2-8 7-12 14-12s12 4 14 12"/>
  </g>
</svg>
</div>
</body></html>
